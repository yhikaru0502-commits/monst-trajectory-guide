<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>モンスト軌道ガイド Web v1.0</title><meta name="theme-color" content="#20283a"><link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#121722;color:#f2f5fb;font:14px system-ui,-apple-system,sans-serif}
header{padding:12px 14px;background:#20283a;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:10px;background:#1b2230}
button,.filebtn,select,input[type=number]{background:#303b52;border:1px solid #52617b;border-radius:7px;color:white;padding:9px 11px;font:inherit}
button.active{background:#1670b5;border-color:#6dbbff}.savebtn{background:#176e4a;border-color:#4bc68e;font-weight:700}button:active{transform:translateY(1px)}
.filebtn{cursor:pointer}input[type=file]{display:none}
label.check{display:flex;align-items:center;gap:4px;padding:5px}
input[type=number]{width:62px;padding:7px}
main{padding:8px}.canvaswrap{height:min(72vh,820px);min-height:340px;background:#0c1018;border:1px solid #3b465d;border-radius:9px;overflow:hidden;touch-action:none;overscroll-behavior:contain;position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.status{color:#bac8dc;padding:8px 12px;line-height:1.6}
.small{font-size:12px;color:#b7c6dd}
#preview{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px}#preview.open{display:flex}#preview img{max-width:100%;max-height:75vh;object-fit:contain}#preview p{margin:0;color:white;text-align:center}#preview button{font-size:16px}

/* Fullscreen practice: fixed viewport, original image aspect ratio preserved */
body.practice header,body.practice .toolbar,body.practice #wallcontrols,body.practice #modes,body.practice .status{display:none}
body.practice main{position:fixed;inset:0;padding:0;z-index:20;background:#05080d}
body.practice .canvaswrap{width:100%;height:100%;min-height:0;border:0;border-radius:0}
#practicebar{display:none;position:fixed;z-index:25;top:env(safe-area-inset-top,0px);left:0;right:0;align-items:center;justify-content:space-between;gap:6px;padding:6px 10px;background:rgba(10,16,26,.75);backdrop-filter:blur(5px)}
body.practice #practicebar{display:flex}
#practicebar button{font-size:13px;padding:7px 9px}
#anglehud{font-variant-numeric:tabular-nums;font-size:12px;color:white;text-shadow:0 1px 3px black}
#quickbar{display:flex;gap:6px;align-items:center}
</style></head>
<body>
<header><h1>モンスト軌道ガイド <span class="small">Web v1.0</span></h1><span class="small">画像処理は端末内で完結・サーバー送信なし</span></header>
<div class="toolbar">
<label class="filebtn">画像を開く<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/*"></label>
<button id="practice">全画面・練習モード</button><button id="export" class="savebtn">ガイド入り画像を保存</button><button id="undo">直前を削除</button><button id="clear">全消去</button><button id="resetview">表示を戻す</button><button id="restorewalls">固定壁に戻す</button>
</div>
<div class="toolbar" id="wallcontrols">
<label class="check"><input id="fixedwall" type="checkbox" checked>iPhone 17 Pro Max 固定壁</label>
<label>左 <input id="wallleft" type="number" value="44" min="0" max="942" step="1"></label>
<label>右 <input id="wallright" type="number" value="897" min="0" max="942" step="1"></label>
<label>上 <input id="walltop" type="number" value="397" min="0" max="2048" step="1"></label>
<label>下 <input id="wallbottom" type="number" value="1372" min="0" max="2048" step="1"></label>
<span class="small">数値は942×2048の画像を基準としたガイド反射中心線の確定座標</span>
</div>
<div class="toolbar" id="modes">
<button data-mode="aim" class="active">照準</button><button data-mode="player">発射キャラ</button>
<button data-mode="field">フィールド</button><button data-mode="enemy">敵（円）</button><button data-mode="block">ブロック</button>
</div>
<div class="toolbar">
<label>タイプ <select id="shot"><option value="reflect">反射</option><option value="pierce">貫通</option></select></label>
<label class="check"><input id="anti" type="checkbox">アンチブロック</label>
<label class="check"><input id="pull" type="checkbox" checked>引っ張り矢印</label>
<label class="check"><input id="edge" type="checkbox" checked>矢印を端まで</label>
<label class="check"><input id="multicolor" type="checkbox" checked>反射ごとに色分け</label>
<label class="check"><input id="snap" type="checkbox" checked>1024段階スナップ</label><label>反射数 <input id="count" type="number" min="1" max="20" value="4"></label>
<label>キャラ半径 <input id="radius" type="number" min="4" max="80" value="18"></label>
</div>
<div id="practicebar"><button id="exitpractice">戻る</button><span id="anglehud">角度 —</span><div id="quickbar"><button id="setplayer">キャラ指定</button><button id="practicesave" class="savebtn">保存</button></div></div>
<main><div class="canvaswrap" id="wrap"><canvas id="cv"></canvas></div></main>
<div id="preview" role="dialog" aria-label="保存用画像プレビュー"><p>iPhone：画像を長押しして「写真に保存」してください</p><img id="previewimg" alt="ガイド入りスクリーンショット"><button id="closepreview">閉じる</button></div>
<div class="status" id="status">① 画像を開く（942×2048基準の固定壁が自動設定） → ② 発射キャラをタップ → ③ 敵・ブロックを配置 → ④ 画面の好きな場所からドラッグして角度を指定。二本指で拡大・移動できます。</div>
<script>
"use strict";
const $=id=>document.getElementById(id), cv=$("cv"),wrap=$("wrap");
let ctx=cv.getContext("2d"), exporting=false;
let img=null, iw=0,ih=0,scale=1,ox=0,oy=0,zoom=1,panX=0,panY=0,mode="aim",player=null,field=null,enemies=[],blocks=[],history=[],start=null,current=null,dragging=false,aim=null,dragVector=null,aimAngle=null,practice=false,previousMode="aim";
const EPS=1e-5, norm=v=>{let n=Math.hypot(...v);return n<EPS?[0,0]:v.map(x=>x/n)}, reflect=(d,n)=>norm([d[0]-2*(d[0]*n[0]+d[1]*n[1])*n[0],d[1]-2*(d[0]*n[0]+d[1]*n[1])*n[1]]);
const radius=()=>Math.max(4,Math.min(80,+$("radius").value||18));
const REF_W=942,REF_H=2048;
const defaultWalls={left:44,right:897,top:397,bottom:1372};
let fixedWallMode=true;
function currentWalls(){return {left:+$("wallleft").value,right:+$("wallright").value,top:+$("walltop").value,bottom:+$("wallbottom").value}}
function setWallInputs(w){$("wallleft").value=w.left;$("wallright").value=w.right;$("walltop").value=w.top;$("wallbottom").value=w.bottom}
function presetField(){if(!img)return null;let w=currentWalls();return {x1:w.left*iw/REF_W,x2:w.right*iw/REF_W,y1:w.top*ih/REF_H,y2:w.bottom*ih/REF_H}}
function updateFixedWalls(){fixedWallMode=$("fixedwall").checked;if(fixedWallMode)field=presetField();draw();setStatus(fixedWallMode?"固定壁を使用中。キャラ位置は手動で指定してください。":"手動フィールドモードです。フィールドをドラッグで設定してください。")}

function fit(){const w=wrap.clientWidth,h=wrap.clientHeight,dpr=devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);let base=img?Math.min(w/iw,h/ih):1;scale=base*zoom;ox=(w-iw*base)/2+panX-(iw*base*(zoom-1))/2;oy=(h-ih*base)/2+panY-(ih*base*(zoom-1))/2;draw()}
function pt(e){let b=cv.getBoundingClientRect();return [(e.clientX-b.left-ox)/scale,(e.clientY-b.top-oy)/scale]}
function inside(p){return img&&p[0]>=0&&p[0]<=iw&&p[1]>=0&&p[1]<=ih}
function save(){history.push(JSON.stringify({player,field,enemies,blocks}));if(history.length>100)history.shift()}
function rect(a,b){return {x1:Math.min(a[0],b[0]),y1:Math.min(a[1],b[1]),x2:Math.max(a[0],b[0]),y2:Math.max(a[1],b[1])}}
function line(a,b,color,width=2,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function rectangle(r,color,width=2,dash=[]){ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.strokeRect(r.x1,r.y1,r.x2-r.x1,r.y2-r.y1);ctx.setLineDash([])}
function circle(c,r,color,width=2,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.arc(c[0],c[1],r,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function draw(){let w=exporting?iw:wrap.clientWidth,h=exporting?ih:wrap.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle="#0c1018";ctx.fillRect(0,0,w,h);if(!img){ctx.fillStyle="#a5b5ce";ctx.textAlign="center";ctx.font="16px system-ui";ctx.fillText("「画像を開く」でスクリーンショットを選択",w/2,h/2);return}
ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.drawImage(img,0,0,iw,ih);
if(!exporting&&field)rectangle(field,fixedWallMode?"#00ffff":"#00d9ff",2/scale,[7/scale,4/scale]);
if(!exporting)for(const b of blocks)rectangle(b,"#ffb000",3/scale);
if(!exporting)for(const e of enemies)circle([e.cx,e.cy],e.r,"#ff4d6d",3/scale);
if(!exporting&&player){circle(player,radius(),"#4dff88",3/scale);line([player[0]-7/scale,player[1]],[player[0]+7/scale,player[1]],"#4dff88",2/scale);line([player[0],player[1]-7/scale],[player[0],player[1]+7/scale],"#4dff88",2/scale)}
if(!exporting&&dragging&&start&&current){if(mode==="field"||mode==="block")rectangle(rect(start,current),"white",2/scale,[5/scale,3/scale]);if(mode==="enemy")circle(start,Math.hypot(current[0]-start[0],current[1]-start[1]),"white",2/scale,[5/scale,3/scale])}
if(player&&(dragVector||dragging&&mode==="aim")){
 const v=!exporting&&dragging&&mode==="aim"&&start&&current?[current[0]-start[0],current[1]-start[1]]:dragVector;
 if(v&&Math.hypot(...v)>1){let a=Math.atan2(-v[1],-v[0]);if($('snap').checked)a=Math.round(a/(2*Math.PI)*1024)*(2*Math.PI/1024);
 aimAngle=a;const len=Math.max(80,Math.hypot(...v));const target=[player[0]-Math.cos(a)*len,player[1]-Math.sin(a)*len];drawAim(target);
 if(!exporting)updateAngleHud(a);
 }}
ctx.restore()}
function edgeDistance(p,d,r){let vals=[];if(Math.abs(d[0])>EPS)for(let x of [r.x1,r.x2]){let t=(x-p[0])/d[0],y=p[1]+d[1]*t;if(t>=0&&y>=r.y1-EPS&&y<=r.y2+EPS)vals.push(t)}
if(Math.abs(d[1])>EPS)for(let y of [r.y1,r.y2]){let t=(y-p[1])/d[1],x=p[0]+d[0]*t;if(t>=0&&x>=r.x1-EPS&&x<=r.x2+EPS)vals.push(t)}return vals.length?Math.min(...vals):null}
function pullArrow(target){let v=[target[0]-player[0],target[1]-player[1]],l=Math.hypot(...v);if(l<4/scale)return;let d=norm(v),perp=[-d[1],d[0]],arrowLen;
if($("edge").checked){let t=edgeDistance(player,d,field||{x1:0,y1:0,x2:iw,y2:ih});arrowLen=t===null?Math.max(l,45/scale):Math.max(0,t-5/scale)}
else arrowLen=Math.min(Math.max(l,45/scale),260/scale);
let tip=[player[0]+d[0]*arrowLen,player[1]+d[1]*arrowLen];
for(const [width,head,color] of [[54,46,"#ff4a2f"],[42,38,"#ff9a2e"],[30,31,"#ffe04a"],[18,24,"#b9f04b"]]){
let hw=width/(2*scale),hh=head/scale,neck=[tip[0]-d[0]*hh,tip[1]-d[1]*hh],points=[];
for(const [base,side] of [[player,hw],[neck,hw*.58],[neck,hw],[tip,0],[neck,-hw],[neck,-hw*.58],[player,-hw]])points.push([base[0]+perp[0]*side,base[1]+perp[1]*side]);
ctx.beginPath();ctx.moveTo(...points[0]);for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
line(player,tip,"#fff6c7",2/scale);ctx.beginPath();ctx.arc(...target,4/scale,0,2*Math.PI);ctx.fillStyle="white";ctx.fill()}
function rayCircle(p,d,e,r){let ox=p[0]-e.cx,oy=p[1]-e.cy,b=2*(ox*d[0]+oy*d[1]),c=ox*ox+oy*oy-r*r,disc=b*b-4*c;if(disc<0)return null;let ts=[(-b-Math.sqrt(disc))/2,(-b+Math.sqrt(disc))/2].filter(t=>t>.01);if(!ts.length)return null;let t=Math.min(...ts),q=[p[0]+d[0]*t,p[1]+d[1]*t];return {t,q,n:norm([q[0]-e.cx,q[1]-e.cy]),kind:"enemy"}}
function rayRect(p,d,r){let tmin=-Infinity,tmax=Infinity,normal=null;for(let i=0;i<2;i++){let low=i?r.y1:r.x1,high=i?r.y2:r.x2;if(Math.abs(d[i])<EPS){if(p[i]<low||p[i]>high)return null;continue}
let a=(low-p[i])/d[i],b=(high-p[i])/d[i],n1=i?[0,-1]:[-1,0],n2=i?[0,1]:[1,0];if(a>b){[a,b]=[b,a];[n1,n2]=[n2,n1]}if(a>tmin){tmin=a;normal=n1}tmax=Math.min(tmax,b);if(tmin>tmax)return null}
if(tmin<=.01)return null;return {t:tmin,q:[p[0]+d[0]*tmin,p[1]+d[1]*tmin],n:normal,kind:"block"}}
function wallHit(p,d){if(!field)return null;/* 固定壁はガイド中心線の反射座標。半径補正を二重にかけない。 */ let r=fixedWallMode?0:radius(),inner={x1:field.x1+r,y1:field.y1+r,x2:field.x2-r,y2:field.y2-r};if(inner.x1>=inner.x2||inner.y1>=inner.y2)return null;
let best=null;for(const [axis,val,n] of [[0,inner.x1,[1,0]],[0,inner.x2,[-1,0]],[1,inner.y1,[0,1]],[1,inner.y2,[0,-1]]]){if(Math.abs(d[axis])<EPS)continue;let t=(val-p[axis])/d[axis],other=1-axis,coord=p[other]+t*d[other];if(t>.01&&coord>= (other?inner.y1:inner.x1)-EPS&&coord<= (other?inner.y2:inner.x2)+EPS&&(!best||t<best.t))best={t,q:[p[0]+t*d[0],p[1]+t*d[1]],n,kind:"wall"}}return best}
function nearest(p,d,skipEnemy=-1){let c=[],wall=wallHit(p,d);if(wall)c.push(wall);
if(!$("anti").checked)for(const b of blocks){let r=radius(),hit=rayRect(p,d,{x1:b.x1-r,y1:b.y1-r,x2:b.x2+r,y2:b.y2+r});if(hit)c.push(hit)}
for(let i=0;i<enemies.length;i++){if(i===skipEnemy)continue;let hit=rayCircle(p,d,enemies[i],enemies[i].r+radius());if(hit){hit.enemyIndex=i;c.push(hit)}}return c.sort((a,b)=>a.t-b.t)[0]||null}
function trajectory(p,d){let segments=[],hits=[],count=Math.max(1,Math.min(20,+$("count").value||4));for(let iter=0,guard=0;iter<count&&guard<150;guard++){let hit=nearest(p,d);if(!hit){segments.push([p,[p[0]+d[0]*3000,p[1]+d[1]*3000]]);break}segments.push([p,hit.q]);if(hit.kind==="enemy"&&$("shot").value==="pierce"){let e=enemies[hit.enemyIndex],r=e.r+radius(),exit=rayCircle([hit.q[0]+d[0]*.01,hit.q[1]+d[1]*.01],d,e,r);if(exit){let end=[exit.q[0]+d[0]*.5,exit.q[1]+d[1]*.5];segments.push([hit.q,end]);p=end}else p=[hit.q[0]+d[0]*.5,hit.q[1]+d[1]*.5];continue}
hits.push(hit.q);d=reflect(d,hit.n);p=[hit.q[0]+d[0]*.5,hit.q[1]+d[1]*.5];iter++}
if(hits.length)segments.push([p,[p[0]+d[0]*180,p[1]+d[1]*180]]);return {segments,hits}}
// Each bounce gets its own contrasting color. Keep trajectory geometry unchanged.
const ROUTE_COLORS=["#52ff52","#19d9ff","#ffae32","#ff55d7","#ffe43c","#b68bff","#ff7060","#58f4b2","#5aa2ff","#ffb3e1","#c8ff59","#ff8950"];
function guideUnit(){return exporting?Math.max(1,iw/942):1/scale}
function routeStroke(a,b,color,u){
 // Dark outline makes overlapping paths distinguishable against bright screenshots.
 line(a,b,"rgba(9,15,25,.84)",8*u);
 line(a,b,color,4.5*u);
}
function drawMarker(p,i,u){
 // The true bounce coordinate must remain visible against the game's floor pattern.
 // A 50%-opacity disc marks the vicinity, while a tiny crosshair pinpoints the exact coordinate.
 const first=i===0,r=(first?(exporting?22:14):(exporting?18:11))*u;
 const color=first?"255,36,36":"255,229,58";
 ctx.save();
 ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);
 ctx.fillStyle=`rgba(${color},0.5)`;ctx.fill();
 ctx.strokeStyle=first?"rgba(255,255,255,.75)":"rgba(30,34,39,.7)";
 ctx.lineWidth=(first?2:1.5)*u;ctx.stroke();
 // Small central pin is the actual wall-contact coordinate, not the edge of the circle.
 ctx.beginPath();ctx.arc(p[0],p[1],2.5*u,0,Math.PI*2);
 ctx.fillStyle=first?"#ff1717":"#ffe500";ctx.fill();
 ctx.strokeStyle="#101820";ctx.lineWidth=1.2*u;ctx.stroke();
 // Move the number outside the disc so it cannot hide the precise contact point.
 const tx=p[0]+r+9*u,ty=p[1]-r-5*u;
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.font=`900 ${(first?(exporting?25:17):(exporting?21:14))*u}px Arial, sans-serif`;
 ctx.lineJoin="round";ctx.strokeStyle="#121820";ctx.lineWidth=4*u;
 ctx.strokeText(String(i+1),tx,ty);
 ctx.fillStyle=first?"#ff4d4d":"#fff04c";ctx.fillText(String(i+1),tx,ty);
 ctx.restore();
}
function updateAngleHud(a){const deg=((a*180/Math.PI)%360+360)%360;const step=((Math.round(deg*1024/360)%1024)+1024)%1024;$('anglehud').textContent=deg.toFixed(3)+'° / '+step+'・1024';}
function drawAim(target){let d=norm([player[0]-target[0],player[1]-target[1]]);if(Math.hypot(player[0]-target[0],player[1]-target[1])<2/scale)return;
if($("pull").checked)pullArrow(target);else line(player,target,"white",2/scale,[5/scale,4/scale]);
let result=trajectory(player,d),u=guideUnit(),colors=$("multicolor").checked;
result.segments.forEach(([a,b],i)=>routeStroke(a,b,colors?ROUTE_COLORS[i%ROUTE_COLORS.length]:"#63ff4d",u));
result.hits.forEach((p,i)=>drawMarker(p,i,u));
}
// Touch Events are used on phones; Pointer Events on desktop. Avoid duplicate events.
function beginAt(p){if(!inside(p)){setStatus("画像の範囲内をタッチしてください。");return}
if(mode==="player"){save();player=p;aim=null;dragVector=null;draw();setStatus("発射キャラを設定しました。");if(practice){mode="aim";$('setplayer').textContent="キャラ指定"}return}
dragging=true;start=p;current=p;draw()}
function moveAt(p){if(!dragging)return;current=p;scheduleDraw()}
function finishAt(p){if(!dragging)return;current=p;
if(mode==="aim"){const v=[current[0]-start[0],current[1]-start[1]];if(Math.hypot(...v)>3/Math.max(scale,.1)){dragVector=v;aim=[player?player[0]+v[0]:0,player?player[1]+v[1]:0];setStatus("角度を設定しました。どこからでも再ドラッグできます。")}}
else if(mode==="field"){let r=rect(start,current);if(r.x2-r.x1>5&&r.y2-r.y1>5){save();field=r;fixedWallMode=false;$("fixedwall").checked=false;setStatus("手動フィールドを設定しました。")}}
else if(mode==="enemy"){let r=Math.hypot(current[0]-start[0],current[1]-start[1]);if(r>3){save();enemies.push({cx:start[0],cy:start[1],r});setStatus("敵を追加しました。")}}
else if(mode==="block"){let r=rect(start,current);if(r.x2-r.x1>3&&r.y2-r.y1>3){save();blocks.push(r);setStatus("ブロックを追加しました。")}}
dragging=false;start=null;current=null;draw()}
let redrawPending=false;
function scheduleDraw(){if(redrawPending)return;redrawPending=true;requestAnimationFrame(()=>{redrawPending=false;draw()})}
function setStatus(s){$("status").textContent=s}
let touchInProgress=false, gesture=null;
function localTouch(t){let b=cv.getBoundingClientRect();return [t.clientX-b.left,t.clientY-b.top]}
function beginGesture(touches){
 const a=localTouch(touches[0]),b=localTouch(touches[1]);
 const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 gesture={distance:Math.max(1,Math.hypot(a[0]-b[0],a[1]-b[1])),initialZoom:zoom,anchor:[(mid[0]-ox)/scale,(mid[1]-oy)/scale]};
 dragging=false;start=current=null;draw();
}
function updateGesture(touches){if(!gesture)return;
 const a=localTouch(touches[0]),b=localTouch(touches[1]),mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 const dist=Math.max(1,Math.hypot(a[0]-b[0],a[1]-b[1]));
 zoom=Math.min(8,Math.max(1,gesture.initialZoom*dist/gesture.distance));
 const w=wrap.clientWidth,h=wrap.clientHeight,base=Math.min(w/iw,h/ih);
 panX=mid[0]-gesture.anchor[0]*base*zoom-(w-iw*base)/2+iw*base*(zoom-1)/2;
 panY=mid[1]-gesture.anchor[1]*base*zoom-(h-ih*base)/2+ih*base*(zoom-1)/2;
 fit();
}

function touchPoint(t){return pt(t)}
cv.addEventListener("touchstart",e=>{
 e.preventDefault();touchInProgress=true;
 if(e.touches.length>=2&&img){beginGesture(e.touches);return}
 if(e.touches.length===1&&!gesture)beginAt(touchPoint(e.touches[0]));
},{passive:false});
cv.addEventListener("touchmove",e=>{
 if(!touchInProgress)return;e.preventDefault();
 if(e.touches.length>=2){if(!gesture&&img)beginGesture(e.touches);updateGesture(e.touches);return}
 if(gesture)return;
 if(e.touches.length===1)moveAt(touchPoint(e.touches[0]));
},{passive:false});
cv.addEventListener("touchend",e=>{
 e.preventDefault();
 if(gesture){if(e.touches.length<2){gesture=null;dragging=false;start=current=null;draw()}if(!e.touches.length)touchInProgress=false;return}
 if(e.changedTouches.length)finishAt(touchPoint(e.changedTouches[0]));
 if(!e.touches.length)touchInProgress=false;
},{passive:false});
cv.addEventListener("touchcancel",()=>{gesture=null;touchInProgress=false;dragging=false;draw()});
cv.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"||touchInProgress)return;beginAt(pt(e));try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener("pointermove",e=>{if(e.pointerType==="touch"||touchInProgress)return;moveAt(pt(e))});
cv.addEventListener("pointerup",e=>{if(e.pointerType==="touch"||touchInProgress)return;finishAt(pt(e))});
cv.addEventListener("pointercancel",e=>{if(e.pointerType==="touch")return;dragging=false;draw()});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===b));draw()});
$("file").addEventListener("change",e=>{
const f=e.target.files&&e.target.files[0];if(!f){setStatus("画像が選択されていません。");return}
setStatus("画像を読み込み中…");
const reader=new FileReader();
reader.onerror=()=>setStatus("画像の読み込みに失敗しました。別のPNG/JPEG画像を試してください。");
reader.onload=()=>{const image=new Image();image.onload=()=>{
img=image;iw=image.naturalWidth;ih=image.naturalHeight;zoom=1;panX=panY=0;player=aim=dragVector=null;field=fixedWallMode?presetField():null;enemies=[];blocks=[];history=[];
fit();setStatus(fixedWallMode?"固定壁を自動設定しました。発射キャラを選択してタップしてください。":"画像を読み込みました。フィールドをドラッグで指定してください。");
};image.onerror=()=>setStatus("画像形式を表示できません。PNG/JPEGでお試しください。");image.src=reader.result};
reader.readAsDataURL(f);
});
// Save a full-resolution PNG, independent of on-screen zoom, pan and devicePixelRatio.
function createExportCanvas(){
 if(!img||!player||!dragVector){setStatus("画像・発射キャラ・照準を設定してから保存してください。");return null}
 const output=document.createElement("canvas");output.width=iw;output.height=ih;
 const old={ctx,scale,ox,oy,exporting};
 try{
   ctx=output.getContext("2d");scale=1;ox=0;oy=0;exporting=true;draw();
 }finally{ctx=old.ctx;scale=old.scale;ox=old.ox;oy=old.oy;exporting=old.exporting}
 return output
}
let previewURL=null;
function showPreview(url){if(previewURL)URL.revokeObjectURL(previewURL);previewURL=url;$("previewimg").src=url;$("preview").classList.add("open")}
$("closepreview").onclick=()=>{$("preview").classList.remove("open");$("previewimg").removeAttribute("src");if(previewURL){URL.revokeObjectURL(previewURL);previewURL=null}};
$("export").onclick=()=>{
 const output=createExportCanvas();if(!output)return;
 const filename="monst_guide_"+new Date().toISOString().replace(/[:.]/g,"-")+".png";
 setStatus("元画像と同じ "+iw+"×"+ih+"px のPNGを作成しています…");
 output.toBlob(blob=>{
  if(!blob){setStatus("画像の生成に失敗しました。");return}
  const url=URL.createObjectURL(blob);
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  if(isIOS){
    // iOS Safari commonly displays rather than downloads PNGs; offer long-press Save to Photos.
    showPreview(url);setStatus("元画像と同じ "+iw+"×"+ih+"px。画像を長押しして写真に保存してください。");
  }else{
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setStatus("元画像と同じ "+iw+"×"+ih+"px のPNGを保存しました。");
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }
 },"image/png");
};
function togglePractice(on){practice=on;document.body.classList.toggle('practice',on);if(on){previousMode=mode;mode='aim';$('practice').textContent='練習モード中';$('setplayer').textContent='キャラ指定';setStatus('画面のどこからでもドラッグして角度を指定できます。')}else{mode=previousMode;$('practice').textContent='全画面・練習モード'}
zoom=1;panX=panY=0;fit();setTimeout(fit,150)}
$('practice').onclick=()=>{if(!img){setStatus('先にスクリーンショットを読み込んでください。');return}togglePractice(true)};
$('exitpractice').onclick=()=>togglePractice(false);
$('setplayer').onclick=()=>{mode=mode==='player'?'aim':'player';$('setplayer').textContent=mode==='player'?'画面をタップ':'キャラ指定'};
$('practicesave').onclick=()=>$('export').click();
$('resetview').onclick=()=>{zoom=1;panX=panY=0;fit();setStatus("画像表示を全体表示に戻しました。")};
cv.addEventListener("wheel",e=>{if(!img)return;e.preventDefault();const b=cv.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;const ix=(mx-ox)/scale,iy=(my-oy)/scale;zoom=Math.min(8,Math.max(1,zoom*(e.deltaY<0?1.15:1/1.15)));const base=Math.min(wrap.clientWidth/iw,wrap.clientHeight/ih);panX=mx-ix*base*zoom-(wrap.clientWidth-iw*base)/2+iw*base*(zoom-1)/2;panY=my-iy*base*zoom-(wrap.clientHeight-ih*base)/2+ih*base*(zoom-1)/2;fit()},{passive:false});
$("undo").onclick=()=>{if(!history.length)return;({player,field,enemies,blocks}=JSON.parse(history.pop()));aim=dragVector=null;draw()};
$("clear").onclick=()=>{save();player=aim=dragVector=null;field=fixedWallMode?presetField():null;enemies=[];blocks=[];draw()};
$("fixedwall").addEventListener("change",updateFixedWalls);
for(const id of ["wallleft","wallright","walltop","wallbottom"])$(id).addEventListener("change",()=>{let w=currentWalls();if(!(w.left<w.right&&w.top<w.bottom)){setStatus("壁の座標が逆転しています。左＜右、上＜下にしてください。");return}if(fixedWallMode){field=presetField();draw();setStatus("固定壁の位置を更新しました。")}});
$("restorewalls").onclick=()=>{setWallInputs(defaultWalls);$("fixedwall").checked=true;updateFixedWalls();setStatus("固定壁の初期値に戻しました。");};
for(const id of ["shot","anti","pull","edge","count","radius","multicolor","snap"])$(id).addEventListener("input",draw);
window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();$("undo").click()}});
if(typeof ResizeObserver!=="undefined")new ResizeObserver(fit).observe(wrap);else window.addEventListener("resize",fit);if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>{});fit();
